name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The target runtime. Local development is on 3.11, so the code stays
  # compatible with both and the linter is configured for the lower bound.
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.14.3
      - run: ruff check core/ libs/ compute/ services/ scripts/ tests/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Integration tests need Docker-managed Postgres and are covered by the
      # migrations job; slow tests are full benchmark sweeps, not a gate.
      - name: Run test suite
        run: |
          pytest -m "not integration and not slow" \
            --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  migrations:
    name: Migrations against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector build, matching infra/docker-compose.yml.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: gsip
          POSTGRES_PASSWORD: gsip_password
          POSTGRES_DB: gsip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gsip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://gsip:gsip_password@localhost:5432/gsip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations
        working-directory: services/api
        run: alembic upgrade head
      - name: Confirm schema and pgvector availability
        run: python scripts/check_database.py

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: gsip-app:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Import check inside the image
        run: |
          docker run --rm gsip-app:latest python -c "
          import services.api.main
          import services.judge.main
          import services.optimizer
          import compute.domain_packs
          import core.contract
          import libs.ledger.gsip_ledger.hashing
          print('all service entrypoints import')
          "

  web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Test
        working-directory: apps/web
        run: npm run test -- --run
