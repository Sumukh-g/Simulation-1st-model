services:
  postgres:
    # pgvector build of the same Postgres major version, so existing volumes
    # keep working. The extension is what backs retrieval at launch (see the
    # build brief's pgvector-before-Milvus swap); having it available now avoids
    # an infrastructure change when the retrieval port lands.
    image: pgvector/pgvector:pg15
    container_name: gsip-postgres
    environment:
      POSTGRES_USER: gsip
      POSTGRES_PASSWORD: gsip_password
      POSTGRES_DB: gsip
    ports:
      - "5433:5432"
    # Raise the client limit: SSE streams + Temporal workers + API pool can
    # otherwise hit the default (~100) and freeze the UI with reconnect loops.
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsip"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: gsip-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: gsip-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  temporal:
    image: temporalio/auto-setup:latest
    container_name: gsip-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: gsip-postgres
      POSTGRES_USER: gsip
      POSTGRES_PWD: gsip_password
      POSTGRES_DB: temporal
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  ray:
    image: rayproject/ray:latest
    container_name: gsip-ray
    # Avoid colliding gcs port 10002 with the worker port range start.
    command: ["ray", "start", "--head", "--port=6379", "--ray-client-server-port=10001", "--dashboard-host=0.0.0.0", "--block"]
    ports:
      - "10001:10001"
      - "8265:8265"
    shm_size: "2gb"
    profiles: ["ray-cluster"]
    # Optional: local demos use in-process Ray (RAY_ADDRESS=local).
    # Start the cluster with: docker compose --profile ray-cluster up -d

  milvus:
    image: milvusdb/milvus:latest
    container_name: gsip-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      DEPLOY_MODE: "standalone"
      ETCD_USE_EMBED: "true"
      MINIO_USE_EMBED: "true"
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus

volumes:
  postgres_data:
  redis_data:
  minio_data:
  milvus_data:
