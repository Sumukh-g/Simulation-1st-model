[tool.poetry]
name = "gsip-orchestrator"
version = "0.1.0"
description = "GSIP Orchestrator Service - Temporal Workflows"
authors = ["GSIP Team"]

[tool.poetry.dependencies]
python = "^3.11"
temporalio = "^1.4.0"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
redis = "^5.0.1"
openai = "^1.59.0"
python-dotenv = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
